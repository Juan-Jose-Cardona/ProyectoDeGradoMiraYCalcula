<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reparte los Objetos</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">


<!--Fav Icon-->
<link rel="shortcut icon" href="../src/img/shortcutIcon.png" type="image/png" />

<link rel="stylesheet" href="CSS/juegoRepartir.css?v=2">
<script defer src="src/js/juegoRepartir.js?v=2"></script>
</head>

<body>

<!-- PANEL PRINCIPAL -->
<div class="panel-juego">

    <!-- BOTÓN VOLVER -->
    <button class="btn-volver" onclick="location.href='menuOperaciones.html'">⟵</button>

    <!-- TÍTULO / PROBLEMA -->
    <div class="pregunta-bar">
        <span id="textoProblema"></span>
    </div>

    <!-- ÁREA DE OBJETOS + CESTAS -->
    <div class="contenedor-principal">

        <!-- OBJETOS -->
        <div id="grid" class="grid"></div>

        <!-- CESTAS -->
        <div id="cestas" class="cestas"></div>

    </div>

    <!-- BOTÓN PARA COMPLETAR DIVISIÓN -->
    <div class="zona-botones">
        <button id="btnCompletar" class="btn-completar">Completar división</button>
        <button id="btnSiguiente" class="btn-siguiente oculto">Siguiente problema</button>
    </div>

</div>

<!-- CONTROLES DE MÚSICA -->
<div id="controlesMusica">
    <button id="btnMute">🔊</button>
    <input id="volumenMusica" type="range" min="0" max="1" step="0.01" value="0.4">
</div>


<!-- MENSAJE DE EXPLICACIÓN (MODAL) -->
<div id="modalExplicacion" class="modal-oculto">
    <div class="modal-contenido">
        <p id="textoExplicacion"></p>
        <button id="cerrarModal" class="btn-cerrar-modal">Aceptar</button>
    </div>
</div>


</body>
</html>
