<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Puzzle Figuras</title>
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  
  <!--Fav Icon-->
  <link rel="shortcut icon" href="../src/img/shortcutIcon.png" type="image/png" />
  <link rel="stylesheet" href="./CSS/estiloFiguras.css">
  <script defer src="./src/js/puzzle.js"></script>
  <script defer src="./src/js/uipuzzle.js"></script>
  <script defer src="./src/js/victoryPuzzle.js"></script>
</head>
<body>

<div class="panel-juego">

    <button class="btn-volver" onclick="location.href='menuFiguras.html'">⟵</button>

    <div class="pregunta-bar">
        <div id="missionText"></div>
    </div>

    <!-- Área del puzzle -->
    <main id="stage">
        <div id="assembly-guide" aria-hidden="true"></div>
    </main>
    <div id="assembly-guide"></div>

    <footer class="controls">
        <button id="resetBtn">Reiniciar</button>
         <span id="status">Conectadas: 0 / 16</span> 
         
      <div id="controlesMusica">
          <button id="btnMute">🔊</button>
          <input id="volumenMusica" type="range" min="0" max="1" step="0.01" value="0.4">
      </div>
</footer>
    

</div>

</body>


</html>
